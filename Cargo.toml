[package]
name = "clickdown"
version = "0.3.1"
edition = "2021"
description = "A fast and responsive ClickUp terminal client"
authors = ["Y.K. Goon"]

[dependencies]
# TUI framework
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Futures utilities
futures = "0.3"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Better error messages for serde deserialization
serde_path_to_error = "0.1"

# Async trait for dependency injection
async-trait = "0.1"

# SQLite for caching
rusqlite = { version = "0.32", features = ["bundled"] }

# Configuration and directories
dirs = "5"

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Markdown rendering for documents
pulldown-cmark = "0.12"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# URL encoding
urlencoding = "2"

# Clipboard access
arboard = "3"

[dev-dependencies]
tempfile = "3"
insta = "1.39"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
